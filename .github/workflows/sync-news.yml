name: Periodic News Feed Sync

on:
  schedule:
    # Runs every 20 minutes (free on GitHub Actions)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel News Aggregation Endpoint
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VERCEL_APP_URL" ]; then
            echo "VERCEL_APP_URL secret is not set yet. Skipping ping."
            exit 0
          fi
          echo "Pinging ${VERCEL_APP_URL}/api/cron/sync-news..."
          curl -f -X GET "${VERCEL_APP_URL}/api/cron/sync-news" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 || echo "Sync ping finished"
